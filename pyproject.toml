[project]
name = "econ-calendar"
version = "0.1.0"
description = "Generate subscribable iCalendar feeds from an economic calendar API."
requires-python = ">=3.9"
dependencies = [
    "ics>=0.7.2",
    "pytz>=2024.1",
    "requests>=2.31.0",
]

[project.scripts]
econ-calendar = "econ_calendar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_calendar"]
